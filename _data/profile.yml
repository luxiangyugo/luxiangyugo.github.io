tagline: Reliable Visual Perception across Scales
intro: I study how to see reliably under challenging imaging conditions—connecting imaging mechanisms, annotation-efficient learning, and practical vision systems.
intro_zh: 我是陆祥宇，现为浙江大学杭州国际科创中心博士后，研究复杂成像条件下的可靠视觉感知，应用涵盖农业无人机遥感与光学制造检测。我关注成像退化与结构恢复、低标注成本的视觉学习，以及几何和跨焦层信息驱动的异常感知，希望将对成像问题的理解转化为可验证、可应用的视觉方法。
background_zh: 我于 2025 年获得浙江大学农业电气化与自动化博士学位，曾于 2024 年 7 月至 2025 年 6 月在多伦多大学开展联合培养博士研究。目前重点推进多焦层光学缺陷感知及工业视觉定位，并主持国家自然科学基金青年科学基金项目（C类，2027–2029 年）。
