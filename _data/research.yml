earlier_projects:
- id: get
  name: GeT · grape leaf disease and pest diagnosis
  status: Published · JKSU-CIS 2022
  category: Plant health perception
  method: Ghost-convolution features and a transformer encoder combine local symptom details with broader leaf
    context for disease and pest classification. The work was evaluated using the GLDP12k grape-leaf image
    dataset.
  contribution: First author. I developed and evaluated the hybrid recognition model.
  image: get-model.webp
  alt: Original GeT model diagram showing the ghost-convolution backbone, transformer encoder, classification
    head, and grape-leaf activation maps.
  caption: Original research figure · model architecture and activation maps.
  links:
  - name: Paper
    url: https://doi.org/10.1016/j.jksuci.2022.03.006
  - name: Code
    url: https://github.com/luxiangyugo/GeT_model
  image_width: 2651
  image_height: 2104
- id: algal-mapping
  name: UAV mapping of lake algal blooms
  status: Research project · 2023
  category: Environmental remote sensing
  method: Cascaded waterbody and algal-bloom segmentation identifies affected areas in UAV imagery. Direct
    geo-location connects image-level detections to a geographic map of the lake.
  image: algal-mapping.webp
  alt: Original aerial lake map with spatial algal-bloom detections overlaid along the shoreline and surrounding
    water.
  caption: Original project visualization · algal-bloom mapping.
  links:
  - name: Code
    url: https://github.com/luxiangyugo/AlgalDet
  image_width: 1175
  image_height: 822
- id: citrus-sizing
  name: Vision-based citrus sizing
  status: Engineering project · 2020
  category: Visual measurement
  method: HSV-based segmentation isolates citrus fruit against a controlled background. Image geometry and
    pixel measurements are then used to estimate fruit diameter.
  image: citrus-sizing.webp
  alt: Original citrus sizing image showing individual fruit with measured outlines and diameter annotations.
  caption: Original project image · fruit segmentation and diameter estimates.
  image_width: 577
  image_height: 388
- id: libs
  name: LIBS sensing of soil heavy metals
  status: Undergraduate thesis · 2020
  category: Optical spectroscopy
  method: Laser-induced breakdown spectroscopy (LIBS) is used to detect heavy metals in soil. I studied signal
    enhancement through an argon environment and a light-convergence chamber, and designed a batch-testing
    platform.
  image: libs-spectroscopy.webp
  alt: Original LIBS figure showing principal-component loadings and spectral peaks against wavelength.
  caption: Original thesis figure · spectral features and signal analysis.
  links:
  - name: Slides
    url: /assets/img/r5_libs.pdf
  image_width: 2121
  image_height: 1905
