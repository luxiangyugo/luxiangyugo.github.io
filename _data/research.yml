- id: citrus-sizing
  name: Vision-based citrus sizing
  status: Engineering project · 2020
  category: Visual measurement
  method: HSV segmentation isolates citrus fruit under controlled-background imaging. Bounding-box pixel dimensions
    are converted into diameter estimates using the camera imaging geometry.
