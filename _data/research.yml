projects:
- id: optical-focus
  archive_number: 15
  name: Multi-focus defect perception in optical components
  status: Ongoing research
  category: Optical inspection
  method: A 25-layer focus stack captures how the same lens region changes with focus. Cross-layer analysis
    compares response strength and trajectory shape against normal optical-structure evolution, aiming to
    distinguish defect-related deviations from persistent background patterns.
  image: multi-focus-trajectories.png
  alt: Concept illustration of a lens and 25-layer focus stack. Matched defect and normal-region markers connect
    to illustrative response trajectories; both persist across focus but differ in strength and shape.
  caption: Concept illustration · 25-layer input and illustrative focus-response trajectories.
  illustration: true
  context:
    label: Industry context
    name: Sunny Optical
    name_zh: 舜宇光学
    url: https://www.sunnyoptical.com/en/default.html
  image_width: 1536
  image_height: 1024
  result: Polar–Fourier decomposition provides the spatial prior. Cross-focus feature modeling and joint
    perception remain under development; the trajectories shown are illustrative, not measured results.
  links:
  - name: Prototype outputs
    url: /assets/images/polar-fourier-research.svg
- id: optical-roi
  archive_number: 14
  name: Multimodal optical localization with Florence-2
  status: Prototype · ongoing evaluation
  category: Vision-language perception
  method: Image features and language tokens jointly enter Florence-2’s multimodal encoder–decoder, converting
    target descriptions into candidate image regions. This connects semantic prompts with spatial detections
    for lenses and sensors.
  image: florence2-model-grounding.png
  alt: Concept illustration with image and text inputs entering a visible Florence-2 model, including an image
    encoder and multimodal encoder–decoder. Grounded candidate regions lead to a separate ROI-refinement stage.
  caption: Concept illustration · semantic inputs, Florence-2 model, and grounded regions.
  illustration: true
  image_width: 1536
  image_height: 1024
  result: Geometry refines the candidates into inspection ROIs. Sensor localization uses an outer crop and a
    second inner-region prompt before mapping back to the original image; C++ and Python prototypes are under
    evaluation.
  links:
  - name: Prototype outputs
    url: /assets/images/semantic-geometric-localization.svg
earlier_projects:
- id: grade2seg
  name: Grade2Seg · weakly supervised weed segmentation from severity grades
  status: Research project · revision recorded in 2025
  category: Weakly supervised learning
  method: Image-level weed severity grades provide supervision for spatial segmentation. A Sqrt-Error-Weighted ordinal
    objective learns severity-dependent responses; class activation maps are converted into pseudo-masks for segmentation
    training.
  image: grade2seg.webp
  alt: Grade2Seg research diagram connecting weed severity classification, activation maps, pseudo-masks, and segmentation.
  caption: Research workflow · from image-level supervision to spatial predictions.
  image_width: 2661
  image_height: 1609
  result: The workflow produces broadleaf and grass-weed masks from grade annotations, reducing reliance on manually
    drawn pixel labels. Generalization across field conditions remains an evaluation focus.
  links:
  - name: UnderRevision
    url: https://www.sciencedirect.com/journal/computers-and-electronics-in-agriculture
    note: Revision status recorded on the previous homepage; link opens the journal.
  - name: GitHub
    url: https://github.com/luxiangyugo/WeedSeg
  archive_number: 13
- id: cropsr
  name: CropSR / EVADM
  status: Published · ISPRS JPRS 2024
  category: Image restoration
  method: Image variance decreases with increasing flight altitude, providing a scale-sensitive cue for aerial-image
    restoration. Variance-Average-Spatial Attention (VASA) incorporates this cue into the iterative reconstruction
    of the EVADM diffusion model.
  image: cropsr.webp
  alt: Original CropSR comparison figure showing a crop-field sample at high resolution, low resolution, and after
    super-resolution.
  caption: Original research figure · HR / LR / SR, top to bottom.
  links:
  - name: Paper
    url: https://doi.org/10.1016/j.isprsjprs.2024.08.017
  - name: GitHub
    url: https://github.com/luxiangyugo/EVADM
  - name: Dataset
    url: https://data.mendeley.com/datasets/fhvph562cn
  image_width: 1200
  image_height: 1159
  result: On the published real-image benchmarks, SRFI improved by 27% at ×2 and 6% at ×4 relative to the baselines.
    Cross-dataset and downstream evaluations support restoration of fine crop structure for agricultural perception.
  archive_number: 12
- id: algal-mapping
  name: UAV mapping of lake algal blooms
  status: Research project · 2023
  category: Environmental remote sensing
  method: Cascaded waterbody and algal-bloom segmentation separates affected water regions from shoreline and terrestrial
    backgrounds. Direct geo-location maps image detections into geographic coordinates.
  image: algal-mapping.webp
  alt: Original aerial lake map with spatial algal-bloom detections overlaid along the shoreline and surrounding
    water.
  caption: Original project visualization · algal-bloom mapping.
  links:
  - name: Project
    url: https://github.com/luxiangyugo/AlgalDet
  image_width: 1175
  image_height: 822
  result: The output is a spatial distribution map of algal-bloom regions, supporting rapid lake surveys and targeted
    follow-up inspection.
  archive_number: 11
- id: paddyseg
  name: PaddySeg · rice-field segmentation and phenology recognition
  status: Published · Drones 2023
  category: Agricultural remote sensing
  method: Ghost Bilateral Network (GBiNet) combines efficient ghost-convolution features with bilateral segmentation
    to identify rice regions and four phenological stages in UAV images.
  image: paddyseg.webp
  alt: Research diagram illustrating aerial field segmentation and direct geographic mapping of rice phenology.
  caption: Original research figure · segmentation and spatial mapping.
  links:
  - name: Paper
    url: https://doi.org/10.3390/drones7020083
  - name: GitHub
    url: https://github.com/luxiangyugo/PaddySeg
  image_width: 2512
  image_height: 1381
  result: GBiNet_r2 achieved 91.50% test mIoU on PaddySeg, compared with 90.95% for BiSeNetV2, with lower computational
    cost. The resulting trait masks support field-scale phenology mapping.
  archive_number: 10
- id: direct-geolocation
  name: Direct geo-location & incremental sparse sampling
  status: Published · Drones 2023 · companion method to PaddySeg
  category: Photogrammetry
  method: Camera parameters and central projection map image pixels directly to ground coordinates. Incremental
    sparse sampling removes redundant observations from overlapping UAV images before trait-map interpolation.
  result: The published evaluation reported a mean deviation of 21 cm across 20 ground-control points, below 1%
    of relative flight height. This provides a direct route from UAV image sequences to georeferenced crop-trait
    maps.
  image: direct-geolocation.webp
  alt: Original diagram of direct UAV image geo-location using camera projection and ground coordinates.
  caption: Original research figure · direct geo-location and trait sampling.
  links:
  - name: Paper
    url: https://doi.org/10.3390/drones7020083
  - name: GitHub
    url: https://github.com/luxiangyugo/PaddySeg
  archive_number: 9
  image_width: 1903
  image_height: 1251
- id: get
  name: GeT · grape leaf disease and pest diagnosis
  status: Published · JKSU-CIS 2022
  category: Plant health perception
  method: Ghost convolution extracts local symptom features with inexpensive linear operations; transformer self-attention
    adds global context for grape-leaf disease and pest classification against complex field backgrounds.
  image: get-model.webp
  alt: Original GeT model diagram showing the ghost-convolution backbone, transformer encoder, classification head,
    and grape-leaf activation maps.
  caption: Original research figure · model architecture and activation maps.
  links:
  - name: Paper
    url: https://doi.org/10.1016/j.jksuci.2022.03.006
  - name: GitHub
    url: https://github.com/luxiangyugo/GeT_model
  image_width: 2651
  image_height: 2104
  result: On GLDP12k, the ImageNet-initialized GeT model achieved 98.14% classification accuracy with 1.16 million
    parameters. The compact architecture supports efficient field-image diagnosis.
  archive_number: 8
- id: weighing-system
  name: Cascaded 24-channel weighing system
  status: Engineering project · 2020
  category: Sensing systems
  method: A cascaded I2C architecture links modular weighing nodes to a shared data-acquisition system. Low-power
    Arduino Pro Mini controllers and plug-in PCBs provide a scalable hardware interface.
  result: The implemented prototype acquires weight measurements across 24 channels, providing a modular basis for
    parallel weighing experiments.
