- id: libs
  name: LIBS sensing of soil heavy metals
  status: Undergraduate thesis · 2020
  category: Optical spectroscopy
  method: Laser-induced breakdown spectroscopy resolves soil-metal signatures from plasma emission spectra. Argon-assisted
    excitation and a light-convergence chamber are evaluated for signal enhancement, with spectral analysis identifying
    informative wavelength features.
  image: libs-spectroscopy.webp
  alt: Original LIBS figure showing principal-component loadings and spectral peaks against wavelength.
  caption: Original thesis figure · spectral features and signal analysis.
  links:
