projects:
- id: optical-focus
  name: Multi-focus defect perception in optical components
  status: Ongoing research
  category: Optical inspection
  method: I study how lens defects appear, fade, or become obscured as the imaging focus changes. The work
    combines concentric and periodic structure modeling with spatial–focus representations to distinguish abnormal
    responses from the normal lens background.
  contribution: I develop mechanism-based prototypes for multi-focus lens inspection under limited supervision,
    connecting optical structure with focus-dependent appearance and subsequent model evaluation.
  image: multi-focus-optics.webp
  alt: Conceptual illustration of a cutaway lens assembly and three inspection images of the same lens at different
    focus indices, with a localized defect becoming sharper at one focus.
  caption: Concept illustration · lens structure and defect appearance across focus indices.
  illustration: true
  context:
    label: Industry context
    name: Sunny Optical
    name_zh: 舜宇光学
    url: https://www.sunnyoptical.com/en/default.html
  image_width: 1536
  image_height: 1024
- id: optical-roi
  name: Geometry-guided optical localization
  status: Implemented prototypes · ongoing evaluation
  category: Practical vision systems
  method: I localize lens centers, inner and outer rings, and sensor-chip regions by refining visual proposals
    with geometric, edge, and concentric-structure checks. Related work studies few-shot anomaly detection
    and transfer across components and imaging conditions.
  contribution: I develop localization methods and C++ and Python API implementations for integration, visualization,
    and evaluation.
  image: optical-localization.webp
  alt: 'Conceptual illustration of lens and image sensor localization: concentric ring fits on a lens, a rectangular
    fit on the sensor active area, and the proposal-to-geometry-to-refined-ROI workflow.'
  caption: Concept illustration · geometry refines lens and sensor localization proposals.
  illustration: true
  image_width: 1536
  image_height: 1024
- id: cropsr
  name: CropSR / EVADM
  status: Published · ISPRS JPRS 2024
  category: Image restoration
  method: Effective variance attention-enhanced diffusion uses aerial-image variance patterns to guide super-resolution.
    The work connects reconstruction quality with agricultural vision tasks.
  contribution: First author. I developed the variance-aware super-resolution method and its cross-scale evaluation,
    connecting image restoration to downstream perception.
  image: cropsr.webp
  alt: Original CropSR comparison figure showing a crop-field sample at high resolution, low resolution, and
    after super-resolution.
  caption: Original research figure · HR / LR / SR, top to bottom.
  links:
  - name: Paper
    url: https://doi.org/10.1016/j.isprsjprs.2024.08.017
  - name: Code
    url: https://github.com/luxiangyugo/EVADM
  - name: Dataset
    url: https://data.mendeley.com/datasets/fhvph562cn
  image_width: 1200
  image_height: 1159
- id: grade2seg
  name: Grade2Seg
  status: Research project
  category: Weakly supervised learning
  method: Ordinal learning, activation responses, and pseudo-masks connect inexpensive severity annotations
    to weed segmentation, with attention to generalization across field conditions.
  contribution: I study grade-to-segmentation learning and develop the dataset and modeling workflow to reduce
    dependence on dense pixel annotations.
  image: grade2seg.webp
  alt: Grade2Seg research diagram connecting weed severity classification, activation maps, pseudo-masks, and
    segmentation.
  caption: Research workflow · from image-level supervision to spatial predictions.
  image_width: 1000
  image_height: 605
- id: paddyseg
  name: PaddySeg & direct geo-location
  status: Published · Drones 2023
  category: Agricultural remote sensing
  method: A lightweight segmentation workflow combines phenology recognition with camera-based geo-location
    and efficient feature sampling.
  contribution: First author. I developed the segmentation and trait-mapping workflow to connect visual predictions
    with field-scale observation.
  image: paddyseg.webp
  alt: Research diagram illustrating aerial field segmentation and direct geographic mapping of rice phenology.
  caption: Original research figure · segmentation and spatial mapping.
  links:
