<div class="themes">{% for theme in site.data.research.themes %}<a class="theme" href="{{ '/research' | relative_url }}#{{ theme.anchor }}"><span class="theme-number">{{ theme.number }} <span aria-hidden="true">↗</span></span><h3>{{ theme.title }}</h3><p class="theme-label">{{ theme.label }}</p><p>{{ theme.description }}</p></a>{% endfor %}</div>
