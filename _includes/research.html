{% for project in site.data.research.projects %}
<article class="project-detail {% unless project.image %}text-only{% endunless %}" id="{{ project.id }}">
  <div>
    <h2>{{ project.name }}</h2>
    <p class="project-status">{{ project.status }}</p>
    <p>{{ project.method }}</p>
    <p>{{ project.contribution }}</p>
    {% if project.links %}<div class="project-links">{% for link in project.links %}<a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>{% endfor %}</div>{% endif %}
  </div>
  {% if project.image %}<figure><img src="{{ '/assets/images/' | append: project.image | relative_url }}" alt="{{ project.alt }}" loading="lazy"><figcaption>{{ project.caption }}</figcaption></figure>{% endif %}
</article>
{% endfor %}
